<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><radialGradient id="gold"><stop stop-color="#f4d18b"/><stop offset=".7" stop-color="#b88942"/><stop offset="1" stop-color="#73552f"/></radialGradient></defs><rect width="100%" height="100%" fill="#16232c"/><rect x="65" y="45" width="870" height="570" rx="5" fill="#e7dfca"/><text x="105" y="100" fill="#263b42" font-size="24" font-family="sans-serif">CASE 051　元の記録</text><text x="105" y="170" fill="#263b42" font-size="27" font-family="sans-serif">門番は二人。一人は必ず本当を言い、</text><text x="105" y="217" fill="#263b42" font-size="27" font-family="sans-serif">もう一人は必ず嘘を言う。</text><text x="105" y="264" fill="#263b42" font-size="27" font-family="sans-serif">もう一人ならどう答えるかを尋ね、</text><text x="105" y="311" fill="#263b42" font-size="27" font-family="sans-serif">答えの反対の扉を選んだ。</text><text x="105" y="358" fill="#263b42" font-size="27" font-family="sans-serif"></text><text x="105" y="405" fill="#263b42" font-size="27" font-family="sans-serif">質問は、どちらか一人に一度だけ。</text><text x="105" y="452" fill="#263b42" font-size="27" font-family="sans-serif">答えは「はい」か「いいえ」。</text></svg>