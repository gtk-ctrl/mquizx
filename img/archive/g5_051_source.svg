<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#16232c"/><rect x="65" y="45" width="870" height="570" rx="5" fill="#e7dfca"/><text x="105" y="100" fill="#263b42" font-size="24" font-family="sans-serif">CASE 051　元の記録</text><text x="105" y="170" fill="#263b42" font-size="27" font-family="sans-serif">月曜の朝に書かれた日記。</text><text x="105" y="217" fill="#263b42" font-size="27" font-family="sans-serif">「昨日は、弟のサッカーの練習に行った。</text><text x="105" y="264" fill="#263b42" font-size="27" font-family="sans-serif">屋外のグラウンドで、とてもうまくてびっくりした。」</text><text x="105" y="311" fill="#263b42" font-size="27" font-family="sans-serif"></text><text x="105" y="358" fill="#263b42" font-size="27" font-family="sans-serif">昨日は朝から夜まで大雨警報。</text><text x="105" y="405" fill="#263b42" font-size="27" font-family="sans-serif">弟のクラブのグラウンドは終日冠水し、</text><text x="105" y="452" fill="#263b42" font-size="27" font-family="sans-serif">「練習は終日中止」と連絡が出ていた。</text></svg>