<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><radialGradient id="gold"><stop stop-color="#f4d18b"/><stop offset=".7" stop-color="#b88942"/><stop offset="1" stop-color="#73552f"/></radialGradient></defs><rect width="100%" height="100%" fill="#16232c"/><rect x="65" y="45" width="870" height="570" rx="5" fill="#e7dfca"/><text x="105" y="100" fill="#263b42" font-size="24" font-family="sans-serif">CASE 043　元の記録</text><text x="105" y="170" fill="#263b42" font-size="27" font-family="sans-serif">来場者は25人。</text><text x="105" y="217" fill="#263b42" font-size="27" font-family="sans-serif">犬を見学した人は18人。</text><text x="105" y="264" fill="#263b42" font-size="27" font-family="sans-serif">猫を見学した人は15人。</text><text x="105" y="311" fill="#263b42" font-size="27" font-family="sans-serif"></text><text x="105" y="358" fill="#263b42" font-size="27" font-family="sans-serif">来場者は全員、犬か猫の</text><text x="105" y="405" fill="#263b42" font-size="27" font-family="sans-serif">少なくとも一方を見学した。</text></svg>