<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>公開前の点検票。事件番号、見出し、保存形式を点検。内容の照合はこの点検の対象外。</title><rect width="1120" height="670" fill="#16232c"/><text x="64" y="68" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="30" fill="#e9e4d8" text-anchor="start">公開前の点検票</text><rect x="64" y="110" width="992" height="72" rx="8" fill="#213540" stroke="#536c75"/><text x="90" y="156" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="25" fill="#e9e4d8" text-anchor="start">事件番号の欄が埋まっているか</text><text x="1024" y="156" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="24" fill="#e9e4d8" text-anchor="end">点検済み</text><rect x="64" y="208" width="992" height="72" rx="8" fill="#213540" stroke="#536c75"/><text x="90" y="254" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="25" fill="#e9e4d8" text-anchor="start">必要な見出しがあるか</text><text x="1024" y="254" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="24" fill="#e9e4d8" text-anchor="end">点検済み</text><rect x="64" y="306" width="992" height="72" rx="8" fill="#213540" stroke="#536c75"/><text x="90" y="352" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="25" fill="#e9e4d8" text-anchor="start">決められた書式で保存できるか</text><text x="1024" y="352" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="24" fill="#e9e4d8" text-anchor="end">点検済み</text><text x="64" y="438" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="24" fill="#e9e4d8" text-anchor="start">この点検を通過した記録に、印を付ける。</text><rect x="740" y="402" width="316" height="64" rx="8" fill="#16232c" stroke="#536c75"/><text x="898" y="443" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="28" fill="#e9e4d8" text-anchor="middle">〔確認済み〕</text><rect x="64" y="503" width="992" height="118" rx="8" fill="#1a2b34" stroke="#536c75"/><text x="88" y="543" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="24" fill="#e9e4d8" text-anchor="start">元の資料との内容の照合：この点検の対象外。</text><text x="88" y="587" font-family="Noto Sans CJK JP,Yu Gothic,Hiragino Sans,Meiryo,sans-serif" font-size="24" fill="#e9e4d8" text-anchor="start">実施の記録は、この点検票には残さない。</text></svg>