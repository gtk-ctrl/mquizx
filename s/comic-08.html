<main class="comic"><p class="eyebrow">漫画版</p><h1>第八話「黒い紙の継ぎ目」</h1>
<section class="comic-page" id="page-1" aria-label="1ページ"><aside class="story-narration">野鳥園と舞踏会の屋敷で撮った封の写真を持ち、朝倉は鑑識室へ向かった。二つの黒い封に関係があるか、瀬尾に見てもらうためだ。</aside>
<figure class="frame"><img src="comic-08/redraw-01.jpg" alt="鑑識室に着いた水城と朝倉" loading="lazy" width="308" height="412"><p class="caption">翌日・鑑識室</p><p class="speech lower left" style="--point:74%">瀬尾さん、封の写真を二件ぶん持ってきました。</p></figure>
<figure class="frame action-panel"><p class="action-caption">鑑識スタッフが作業灯を引き寄せ、机の中央を照らした。</p><img src="comic-08/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-08/redraw-02.jpg" alt="黒い封が写った二件の写真を並べる瀬尾" loading="lazy" width="307" height="412"><p class="speech upper right" style="--point:20%">野鳥園と舞踏会の屋敷。どちらも、封に黒い紙が貼ってある。</p></figure>
<figure class="frame"><img src="comic-08/redraw-03.jpg" alt="二片を寄せて見る朝倉" loading="lazy" width="307" height="412"><p class="speech upper left" style="--point:74%">角が斜めに切れてます。ここを合わせたら、一枚になるんじゃ？</p></figure>
<p class="folio">1 / 4</p></section>
<section class="comic-page" id="page-2" aria-label="2ページ">
<figure class="frame"><img src="comic-08/redraw-04.jpg" alt="切り口にルーペを当てる水城" loading="lazy" width="308" height="412"><p class="speech upper right" style="--point:20%">切り口を合わせても、傷の線がずれる。間に何か入るのかも。</p></figure>
<figure class="frame"><img src="comic-08/redraw-05.jpg" alt="保管棚を探る瀬尾" loading="lazy" width="308" height="412"><p class="speech lower right" style="--point:20%">黒い紙なら、停電した屋敷の宝石盗難でも見た。あの封の記録を出そう。</p></figure>
<figure class="frame"><img src="comic-08/redraw-06.jpg" alt="停電の夜の屋敷" loading="lazy" width="307" height="412"><p class="caption">別件・宝石盗難の夜</p></figure>
<p class="folio">2 / 4</p></section>
<section class="comic-page" id="page-3" aria-label="3ページ">
<figure class="frame"><img src="comic-08/redraw-07.jpg" alt="瀬尾が机に古い写真を出す" loading="lazy" width="307" height="412"><p class="speech upper left" style="--point:74%">そのときの封だ。こっちにも細い傷がある。</p></figure>
<figure class="frame"><img src="comic-08/redraw-08.jpg" alt="三枚を入れ替える朝倉" loading="lazy" width="308" height="412"><svg aria-hidden="true" focusable="false" viewBox="0 0 308 412" style="position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none"><defs><linearGradient id="board-fill" x2="1" y2="1"><stop stop-color="#bc9f76"/><stop offset="1" stop-color="#a88f6c"/></linearGradient><filter id="board-grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".20"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/><feBlend in2="SourceGraphic" mode="multiply"/></filter></defs><path d="M214 284L292 269L308 279V291L234 307Z" fill="url(#board-fill)" filter="url(#board-grain)"/></svg><p class="speech upper right" style="--point:20%">三枚目を端に置くと、傷がそこで途切れます。</p></figure>
<figure class="frame"><img src="comic-08/redraw-09.jpg" alt="ランプの下で細い傷を指す水城" loading="lazy" width="308" height="412"><p class="speech upper left" style="--point:74%">端で傷が途切れるなら、間に続きがある。野鳥園と舞踏会の間に入れてみて。</p></figure>
<p class="folio">3 / 4</p></section>
<section class="comic-page" id="page-4" aria-label="4ページ">
<figure class="seal-proof"><figcaption>封の切り口と傷を同じ縮尺で照合した図</figcaption><svg viewBox="0 0 360 118" role="img" aria-label="野鳥園、宝石盗難、舞踏会の順に並べると左右の切り口と傷がつながる"><path fill="#25272a" stroke="#b9ac90" d="M10 10H115L125 34L117 56L130 90H10Z M115 10H238L227 44L245 67L237 90H130L117 56L125 34Z M238 10H350V90H237L245 67L227 44Z"/><path d="M20 68L117 56L233 52L342 34" fill="none" stroke="#eed198" stroke-width="2"/><g text-anchor="middle" fill="#27231d" font-size="15"><text x="65" y="110">野鳥園</text><text x="180" y="110">宝石盗難</text><text x="295" y="110">舞踏会</text></g></svg></figure>
<figure class="frame"><img src="comic-08/redraw-10.jpg" alt="同じ縮尺の三枚を机に並べ直す" loading="lazy" width="307" height="412"><p class="speech upper right" style="--point:20%">真ん中なら、左右の切り口がぴたりと合う……。</p></figure>
<figure class="frame action-panel key-moment"><p class="action-caption">朝倉の指が止まった。三枚目を間へ滑り込ませたところだった。</p><img src="comic-08/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-08/redraw-11.jpg" alt="三人で並んだ封を確かめる" loading="lazy" width="307" height="412"><p class="speech upper left" style="--point:74%">切り口がはまって、傷も一本につながった。もとは一枚の紙ね。</p></figure>
<figure class="frame"><img src="comic-08/redraw-12.jpg" alt="照合結果を送る水城と手帳に記録する朝倉" loading="lazy" width="308" height="412"><p class="caption">水城が照合写真を送ると、担当の一人から返事が来た。</p><p class="speech lower right" style="--point:20%">別の日付なのに、同じに見える写真があるそうです。こっちも見てほしいと。</p></figure>
<aside class="story-narration">三件分の封を、瀬尾は一つの台紙に並べ直した。</aside>
<p class="folio">4 / 4</p></section>
