<main class="comic">
<p class="eyebrow">漫画版</p>
<h1>第三話「蔵の市の壺と四通の鑑定書」</h1>
<section class="comic-page" aria-label="1ページ"><aside class="story-narration">帰り道、店主から市場の壺の話を聞いた。水城は写真を店主に送り、翌朝、朝倉と市場へ向かった。</aside>
<figure class="frame f1"><img src="comic-03/remake-01.jpg" alt="水城が市場から届いた壺の画像を朝倉に見せる"><span class="phone-back" aria-hidden="true"></span><p class="caption">帰り道・店主の電話の直後</p><p class="speech point-up" style="left:7%;bottom:8%;--bubble-width:73%;--tail:25%">青い葉が一枚。店主に写真を送って、見てもらおう。</p></figure>
<figure class="frame f2"><img src="comic-03/remake-02.jpg" alt="水城の携帯に店主から返信が届く"><p class="caption">店主からの返信　「うちの壺かもしれません。現物を見せてください」</p></figure>
<figure class="frame f3"><img src="comic-03/remake-03.jpg" alt="二人が屋根のある古物市場に着く"><p class="caption">翌朝・古物市場</p></figure>
<figure class="frame action-panel"><p class="action-caption">二人は店の並ぶ通路を抜け、壺を預かっている売り場へ向かった。</p><img src="comic-03/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f4"><img src="comic-03/remake-04.jpg" alt="市場の担当者が二人の前に青い葉の壺を置く"><p class="speech point-up" style="left:6%;bottom:6%;--bubble-width:81%;--tail:23%">写真の壺はこちらです。持ち込まれた時の書類もあります。</p></figure>
<p class="folio">1 / 4</p>
</section>
<section class="comic-page" aria-label="2ページ">
<figure class="frame f5"><img src="comic-03/remake-05.jpg" alt="市場の担当者が封筒から鑑定書を取り出す" loading="lazy"><p class="caption">壺に添えられていた四通の鑑定書</p></figure>
<figure class="frame f6"><img src="comic-03/remake-06.jpg" alt="水城と朝倉が印や筆跡を見比べる" loading="lazy"><p class="speech point-up" style="left:3%;bottom:27%;--bubble-width:48%;--tail:69%">印のかすれ方も、文字の癖も似てますね。</p><p class="speech point-up" style="left:53%;bottom:27%;--bubble-width:44%;--tail:48%">日付も並べて確かめよう。</p></figure>
<figure class="receipt"><figcaption>鑑定書四通の日付</figcaption><table><tbody><tr><th>一通目</th><td>1892年2月29日</td></tr><tr><th>二通目</th><td>1896年2月29日</td></tr><tr><th>三通目</th><td>1900年2月29日</td></tr><tr><th>四通目</th><td>1904年2月29日</td></tr></tbody></table></figure>
<figure class="frame f7"><img src="comic-03/remake-07.jpg" alt="朝倉が鑑定書を順に指し、水城は考え込む" loading="lazy"><p class="speech point-down" style="left:5%;top:4%;--bubble-width:86%;--tail:76%">四年おきに、どれも二月二十九日。日付は合っていそうですね。</p></figure>
<p class="folio">2 / 4</p>
</section>
<section class="comic-page" aria-label="3ページ">
<figure class="frame f8"><img src="comic-03/remake-08.jpg" alt="水城が手帳を開き、うるう年の条件を考える" loading="lazy"><p class="speech point-down" style="left:4%;top:4%;--bubble-width:84%;--tail:60%">四年おきに見えるね。年の数字をもう一度見て。</p></figure>
<figure class="review-proof"><figcaption>1900年2月末</figcaption><div class="review-tiles" style="--columns:3"><span>2月27日</span><strong>2月28日</strong><strong>3月1日</strong></div></figure><figure class="frame f9"><img src="comic-03/remake-09.jpg" alt="水城が三通目を手元に引いて朝倉に示す" loading="lazy"><p class="speech point-down" style="left:3%;top:4%;--bubble-width:68%;--tail:38%">待って。三通目は1900年。</p><p class="speech point-up" style="left:5%;bottom:7%;--bubble-width:85%;--tail:23%">百で割り切れるのに、四百では割り切れない。1900年には二月二十九日がない！</p></figure>
<figure class="review-proof"><figcaption>青い葉の模様を照合</figcaption><div class="review-tiles" style="--columns:2"><div><div class="detail-crop" aria-label="蔵の市の台帳"><img src="comic-01/remake-04.jpg" alt="" style="width:454.54545454545456%;left:-127.27272727272727%;top:-154.54545454545453%"></div><span>蔵の市の台帳</span></div><div><div class="detail-crop" aria-label="市場の壺"><img src="comic-03/remake-10.jpg" alt="" style="width:370.3703703703704%;left:-251.85185185185185%;top:-144.44444444444443%"></div><span>市場の壺</span></div></div></figure><figure class="frame action-panel"><p class="action-caption">店主は壺をそっと回し、青い葉の先に指を止めた。</p><img src="comic-03/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f10"><img src="comic-03/remake-10.jpg" alt="蔵の市の店主が壺の肩に描かれた青い葉を指で示す" loading="lazy"><p class="caption">市場に着いた蔵の市の店主が、壺を確かめる。</p><p class="speech point-up" style="left:4%;bottom:6%;--bubble-width:86%;--tail:23%">葉の先の釉薬が少し途切れている。うちの壺です。</p></figure>
<p class="folio">3 / 4</p>
</section>
<section class="comic-page" aria-label="4ページ">
<figure class="frame f11"><img src="comic-03/remake-11.jpg" alt="二人が壺の引き渡しを記録し、三通目の鑑定書を別に保管する" loading="lazy"><p class="speech point-down" style="left:4%;top:4%;--bubble-width:90%;--tail:62%">出所を偽った可能性がある。三通目を分けて、持ち込んだ人を確認しよう。</p></figure>
<figure class="frame photo"><img src="comic-03/market-record.jpg" loading="lazy" alt="壺を預かった市場の全景"><p class="caption">壺の出所をたどれるよう、市場の全景も記録に残した。</p></figure>
<figure class="frame f12"><img src="comic-03/remake-12.jpg" alt="資料室で水城が壺の資料を棚に収め、机のメダルの写真に目を留める" loading="lazy"><p class="caption">その夕方・資料室。壺の資料を収め、朝倉は残る二枚のメダルの照会記録を開いた。</p></figure>
<aside class="story-narration">店主の指が、青い葉の先で止まった。四通の紙より先に、その小さな途切れが壺を見分けてくれた。</aside>
<p class="folio">4 / 4</p>
</section>
