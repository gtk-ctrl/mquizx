<h1>第四話「同じ傷」</h1>
<section class="comic-page" aria-label="1ページ"><aside class="story-narration">収集家に渡らなかった二枚の行方を追う中で、鑑識の瀬尾から別件の押収品について連絡が入った。</aside>
<figure class="frame f1"><img src="comic-04/remake-01.jpg" alt="資料室で水城が鳴った携帯を取り上げる"><p class="caption">翌日・資料室。メダルの記録を調べていると、鑑識の瀬尾から電話が来た。</p><p class="speech point-down" style="right:4%;top:26%;--bubble-width:37%;--tail:13%">瀬尾さん。蔵の市の写真なら、手元にあります。</p></figure>
<figure class="frame action-panel"><p class="action-caption">鑑識スタッフが保管棚から押収品を出し、瀬尾に渡す準備をした。</p><img src="comic-04/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f2"><img src="comic-04/remake-02.jpg" alt="瀬尾が鑑識室の机に置かれた押収品を見ながら話す"><p class="caption">鑑識室</p><p class="speech point-up" style="left:4%;bottom:30%;--bubble-width:73%;--tail:60%">別件の押収品に花柄が二枚。写真を送る。</p></figure>
<figure class="frame f3"><img src="comic-04/remake-03.jpg" alt="水城と朝倉が押収写真を収集家の記録と照合する"><p class="speech point-down" style="left:5%;top:2%;--bubble-width:86%;--tail:78%">購入四枚、受取二枚。手元に渡っていないのは二枚でしたね。</p></figure>
<figure class="frame f4"><img src="comic-04/remake-04.jpg" alt="朝倉が控えと押収写真を見比べる"><span class="print-back" aria-hidden="true"></span><p class="speech point-down" style="right:4%;top:5%;--bubble-width:39%;--tail:8%">押収品も二枚。でも、不足分と同じ品でしょうか。</p></figure>
<p class="folio">1 / 4</p>
</section>
<section class="comic-page" aria-label="2ページ">
<figure class="frame f5"><img src="comic-04/remake-05.jpg" alt="水城が収集家に渡ったメダルの写真を拡大する" loading="lazy"><p class="speech point-down" style="left:4%;top:3%;--bubble-width:86%;--tail:52%">まず収集家に渡った方の、花柄の一枚。縁を大きくしてみよう。</p></figure>
<figure class="frame f6"><img src="comic-04/remake-06.jpg" alt="朝倉が押収品の写真を引き寄せる" loading="lazy"><p class="speech point-down" style="left:4%;top:4%;--bubble-width:39%;--tail:86%">押収品の左右も、縁を拡大して並べましょう。</p></figure>
<p class="folio">2 / 4</p>
</section>
<section class="comic-page" aria-label="3ページ">
<div class="medal-comparison"><figure class="frame detail"><img src="comic-04/sale-detail.jpg" alt="花柄のメダルの縁にある段のある欠けと斜めの傷" loading="lazy"><p class="caption">購入記録074 ／ 収集家に渡った品</p></figure>
<figure class="frame detail"><img src="comic-04/seized-left.jpg" alt="押収品の左側のメダルの縁と斜めの傷" loading="lazy"><p class="caption">押収記録082 ／ 左の品</p></figure>
<figure class="frame detail"><img src="comic-04/seized-right.jpg" alt="押収品の右側のメダルの縁と斜めの傷" loading="lazy"><p class="caption">押収記録082 ／ 右の品</p></figure></div>
<figure class="review-proof"><figcaption>三枚の縁を拡大 ／ 斜めの傷と段のある欠け</figcaption><div class="review-tiles" style="--columns:3"><div><div class="detail-crop" aria-label="収集家の品"><img src="comic-04/sale-detail.jpg" alt="" style="width:238.0952380952381%;left:-95.23809523809523%;top:-111.90476190476191%"></div><span>収集家の品</span></div><div><div class="detail-crop" aria-label="押収品・左"><img src="comic-04/seized-left.jpg" alt="" style="width:238.0952380952381%;left:-95.23809523809523%;top:-111.90476190476191%"></div><span>押収品・左</span></div><div><div class="detail-crop" aria-label="押収品・右"><img src="comic-04/seized-right.jpg" alt="" style="width:222.22222222222223%;left:-84.44444444444444%;top:-113.33333333333333%"></div><span>押収品・右</span></div></div></figure><figure class="frame f7"><img src="comic-04/remake-07.jpg" alt="水城と朝倉が二枚の写真を並べて縁を見比べる" loading="lazy"><p class="speech point-down" style="left:4%;top:2%;--bubble-width:72%;--tail:37%">三枚とも、傷の傾きも欠けの段も同じ場所にある。</p></figure>
<figure class="frame f8"><img src="comic-04/remake-08.jpg" alt="鑑識室の瀬尾が別々の袋に入ったメダルを示す" loading="lazy"><p class="caption">再び鑑識室</p><p class="speech point-down" style="right:4%;top:4%;--bubble-width:39%;--tail:8%">現物は別々の袋に一枚ずつ。購入記録と結びつけられそうか？</p></figure><figure class="frame action-panel"><p class="action-caption">現物を傷つけないよう、瀬尾はルーペを縁へ近づけた。</p><img src="comic-04/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>

<p class="folio">3 / 4</p>
</section>
<section class="comic-page" aria-label="4ページ">
<figure class="frame f9"><img src="comic-04/remake-09.jpg" alt="水城が送信を止め、二枚の写真を指す" loading="lazy"><p class="speech point-down" style="left:5%;top:4%;--bubble-width:76%;--tail:68%">型についた傷なら別々の品にも写る。品ごとの傷なら、行方を追う手掛かりになる。現物を見て。</p></figure>
<figure class="frame f10"><img src="comic-04/remake-10.jpg" alt="以前、受付で来訪者が訂正された書類を指す" loading="lazy"><p class="caption">以前、訂正前の記録が別部署から戻ってきた。</p><p class="speech point-up" style="left:4%;bottom:7%;--bubble-width:77%;--tail:20%">訂正したほうが共有されるんですよね。</p></figure>
<figure class="frame f11"><img src="comic-04/remake-11.jpg" alt="朝倉が記録の出所を照会し、水城が保管票を書く" loading="lazy"><p class="caption">保管票　同形の欠けと傷。現物鑑定を要請。</p><p class="speech point-down" style="left:4%;top:3%;--bubble-width:51%;--tail:90%">出所の照会もお願いします。</p></figure>
<figure class="frame f12"><img src="comic-04/remake-12.jpg" alt="水城と朝倉が写真の拡大を閉じて売り場の全景を開く" loading="lazy"><p class="speech point-down" style="left:4%;top:4%;--bubble-width:86%;--tail:26%">鑑定を待つ間に、元の売り場写真を見よう。ケースの周りにも手掛かりがあるかも。</p></figure>
<figure class="frame detail"><img src="comic-05/shop-record.jpg" alt="蔵の市の売り場写真。ケースの向こうに客の後ろ姿" loading="lazy"></figure><aside class="story-narration">朝倉は照合欄に「一致」と書き、その下の「同一品」は空けておいた。収集家に見つかったと伝えるのは、まだ早い。</aside>
<p class="folio">4 / 4</p>
</section>
