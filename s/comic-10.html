<main class="comic"><p class="eyebrow">漫画版</p><h1>第十話「七分進んだカメラ」</h1>
<section class="comic-page" id="page-1" aria-label="1ページ"><aside class="story-narration">翌朝、水城たちは資料室で最終報告に並ぶ事件番号を手掛かりに、元の記録を探した。まず開いたのは宝石店の防犯映像だった。</aside>
<figure class="frame"><img src="comic-10/redraw-01.jpg" alt="水城が最終報告の添付欄を指す" width="308" height="411"><p class="caption">翌朝・資料室</p><p class="speech lower right" style="--point:20%">最終報告の写真に結びつく資料を、事件番号から探します。</p></figure>
<figure class="frame"><img src="comic-10/redraw-02.jpg" alt="係長が書棚を指す" width="307" height="411"><p class="speech lower right" style="--point:20%">番号から戻ろう。元の記録と、配られた版を出してくれ。</p></figure>
<figure class="frame"><img src="comic-10/redraw-03.jpg" alt="朝倉が記録の箱を運ぶ" width="307" height="411"><p class="speech upper left" style="--point:74%">最初は宝石店の侵入事件です。防犯映像が残っています。</p></figure>
<p class="folio">1 / 4</p></section>
<section class="comic-page" id="page-2" aria-label="2ページ">
<figure class="frame action-panel"><p class="action-caption">二人は映像を再生できる席に移った。</p><img src="comic-10/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-10/redraw-04.jpg" alt="朝倉が防犯映像を再生する" width="308" height="411"><p class="speech upper right" style="--point:20%">棚を越えたところで止めます。</p></figure>
<figure class="frame action-panel"><p class="action-caption">朝倉が一時停止を押した。映像が止まり、店の奥まで見渡せた。</p><img src="comic-10/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-10/redraw-05.jpg" alt="宝石店の防犯画面に映る侵入者と店内の壁時計" width="308" height="319"><svg aria-hidden="true" focusable="false" viewBox="0 0 308 319" style="position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none"><ellipse cx="262" cy="43" rx="24" ry="28" fill="#899daa"/><path d="M262 43L274 35M262 43L280 33" stroke="#202b34" stroke-width="2" stroke-linecap="round"/></svg><p class="caption">宝石店・防犯カメラの表示　02:17:30</p></figure>
<figure class="frame"><img src="comic-10/redraw-06.jpg" alt="朝倉がアリバイ表を指す" width="307" height="319"><p class="speech upper right" style="--point:20%">捜査線上の上野には、二時十五分からアリバイがある。映像どおりなら、侵入はその後です。</p></figure>
<p class="folio">2 / 4</p></section>
<section class="comic-page" id="page-3" aria-label="3ページ">
<figure class="frame"><img src="comic-10/redraw-07.jpg" alt="水城が映像を止め、画面を拡大する" width="307" height="319"><p class="speech upper left" style="--point:74%">待って。映像の時刻表示とは別に、右奥の壁にも時計がある。</p></figure>
<figure class="frame clock-frame"><img src="comic-10/redraw-08.jpg" alt="映像に写った壁時計の拡大" width="308" height="319"><svg aria-hidden="true" focusable="false" viewBox="0 0 308 319" style="position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none"><ellipse cx="204" cy="99" rx="65" ry="68" fill="#91a3af"/><path d="M204 99L235 83M204 99L251 74" stroke="#27333c" stroke-width="4" stroke-linecap="round"/></svg><div class="clock-overlay"><svg viewBox="0 0 150 150" aria-label="長針は二、短針も二を少し過ぎた位置" role="img"><circle cx="75" cy="75" r="68" fill="#eee5cf" stroke="#3e332b" stroke-width="3"/><g fill="#18232b" text-anchor="middle" dominant-baseline="middle" font-size="10"><text x="103" y="26.50257738807143">1</text><text x="123.49742261192856" y="46.99999999999999">2</text><text x="131" y="75">3</text><text x="123.49742261192857" y="102.99999999999999">4</text><text x="103" y="123.49742261192857">5</text><text x="75" y="131">6</text><text x="47.000000000000014" y="123.49742261192857">7</text><text x="26.50257738807145" y="103.00000000000003">8</text><text x="19" y="75.00000000000001">9</text><text x="26.502577388071437" y="46.99999999999999">10</text><text x="46.99999999999997" y="26.50257738807145">11</text><text x="74.99999999999999" y="19">12</text></g><path d="M75 75L101 62" stroke="#18232b" stroke-width="5" stroke-linecap="round"/><path d="M75 75L115 54" stroke="#18232b" stroke-width="3" stroke-linecap="round"/><path d="M75 75V124" stroke="#834b3e" stroke-width="1.5"/><circle cx="75" cy="75" r="3" fill="#18232b"/></svg></div><p class="caption">画面右奥・時計の針を拡大</p></figure>
<figure class="frame"><img src="comic-10/redraw-09.jpg" alt="二人で点検票と画面を見比べる" width="308" height="318"><p class="speech upper right" style="--point:20%">当時の聞き取りでは、壁は電波時計。カメラは手で時刻を合わせていたそうよ。</p></figure>
<p class="folio">3 / 4</p></section>
<section class="comic-page" id="page-4" aria-label="4ページ">
<figure class="frame"><img src="comic-10/redraw-10.jpg" alt="水城が元の映像記録の横に当時の訂正票を置く" width="307" height="318"><p class="speech lower right" style="--point:20%">表示は二時十七分三十秒。壁は二時十分ごろ。約七分ずれてる。訂正票も二時十分ね。</p></figure>
<figure class="frame"><img src="comic-10/redraw-11.jpg" alt="朝倉がアリバイの時刻を考え直す" width="307" height="318"><p class="speech upper left" style="--point:74%">二時十分はアリバイが始まる前。上野を外す根拠が崩れました。</p></figure>
<figure class="frame"><img src="comic-10/redraw-12.jpg" alt="水城と朝倉が配布版を開く" width="308" height="318"><p class="speech upper right" style="--point:20%">上野さんを外した理由は七分で消えた。誰が入ったかは、別に確かめよう。</p></figure>
<figure class="time-comparison"><figcaption>侵入時刻の照合</figcaption><dl><div><dt>映像の表示</dt><dd>02:17:30</dd></div><div><dt>壁時計と訂正票</dt><dd>02:10ごろ</dd></div></dl></figure>
<p class="folio">4 / 4</p></section>
