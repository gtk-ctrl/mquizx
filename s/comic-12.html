<main class="comic"><p class="eyebrow">漫画版</p><h1>第十二話「二度目の訂正」</h1>
<section class="comic-page" id="page-1" aria-label="1ページ"><aside class="story-narration">宝石店と理髪店では、当時の訂正票で時刻を直していた。朝倉は、その訂正があとから配られた資料にどう反映されたかを確かめた。</aside><figure class="frame"><img src="comic-12/redraw-01.jpg" alt="水城と朝倉が資料を開く" width="380" height="338"><p class="caption">資料室・二件の訂正票</p><p class="speech lower right" style="--point:20%">宝石店と床屋、どちらも当時の訂正票があります。</p></figure>
<figure class="frame"><img src="comic-12/redraw-02.jpg" alt="朝倉が配布版を机に置く" width="380" height="338"><p class="speech upper left" style="--point:74%">訂正のあとに配られた資料も見つかりました。</p></figure>
<figure class="frame action-panel"><p class="action-caption">朝倉が訂正票と配布資料の束を横に並べた。</p><img src="comic-12/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-12/redraw-03.jpg" alt="水城が資料を三列に並べる" width="380" height="338"><p class="speech upper right" style="--point:20%">元の記録から訂正票へ。そのあと配布版でどう変わった？</p></figure><figure class="comparison"><figcaption>二件の時刻の照合</figcaption><table><thead><tr><th scope="col">事件</th><th scope="col">元の記録</th><th scope="col">訂正票</th><th scope="col">配布版</th></tr></thead><tbody><tr><th scope="row">宝石店</th><td>2:17</td><td>2:10</td><td>2:03</td></tr><tr><th scope="row">床屋</th><td>8:20</td><td>3:40</td><td>8:20</td></tr></tbody></table></figure><p class="folio">1 / 4</p></section>
<section class="comic-page" id="page-2" aria-label="2ページ"><figure class="frame"><img src="comic-12/redraw-04.jpg" alt="朝倉が配布版を指す" width="380" height="338"><p class="speech upper right" style="--point:20%">床屋は証言の時刻に戻ってます。宝石店は、さらに早まってる。</p></figure>
<figure class="frame"><img src="comic-12/redraw-05.jpg" alt="水城が時刻を見比べて考える" width="380" height="337"><p class="speech lower left" style="--point:74%">訂正票から配布版の間に、何をしたらこの時刻になる？</p></figure>
<figure class="review-evidence"><figcaption>訂正票から配布版へ、何が起きたか</figcaption><p>宝石店　2:17 → <strong>−7分</strong> → 2:10 → <strong>−7分</strong> → 2:03</p><p>床屋　8:20 → <strong>左右反転</strong> → 3:40 → <strong>左右反転</strong> → 8:20</p></figure><figure class="frame discovery"><img src="comic-12/redraw-06.jpg" alt="瀬尾が二人の机をのぞく" width="380" height="337"><p class="speech upper right" style="--point:20%">二件とも、訂正済みの時刻に同じ処理がもう一度かかってる。</p></figure><p class="folio">2 / 4</p></section>
<section class="comic-page" id="page-3" aria-label="3ページ"><figure class="frame"><img src="comic-12/redraw-07.jpg" alt="瀬尾が時計の資料を取り出す" width="268" height="337"><p class="speech lower left" style="--point:74%">逆さのデジタル時計を読んだ事件もあったな。</p></figure>
<figure class="frame"><img src="comic-12/redraw-08.jpg" alt="朝倉が三件目を並べる" width="236" height="337"><p class="speech upper right" style="--point:20%">これも配布版で逆さに戻ってます。同じ処理を二度した形です。</p></figure>
<figure class="frame"><img src="comic-12/redraw-09.jpg" alt="水城が訂正票を裏返す" width="252" height="337"><p class="speech upper right" style="--point:20%">処理した人の欄は空白。でも裏に地下の棚番号がある。</p></figure><figure class="review-evidence"><figcaption>訂正票の確認</figcaption><div class="pair"><p>表　処理者欄は空白</p><p>裏　<strong>地下資料室の棚番号</strong></p></div></figure><p class="folio">3 / 4</p></section>
<section class="comic-page" id="page-4" aria-label="4ページ"><figure class="frame"><img src="comic-12/redraw-10.jpg" alt="係長が番号を書き写しかける" width="236" height="337"><p class="speech upper left" style="--point:74%">棚番号だけ控えて、箱を探すか。</p></figure>
<figure class="frame"><img src="comic-12/redraw-11.jpg" alt="係長が受領印のある訂正票を持つ" width="246" height="337"><p class="speech upper right" style="--point:20%">票も持っていこう。番号と受領印を、箱の元資料と照らせる。</p></figure>
<figure class="frame action-panel"><p class="action-caption">水城たちは訂正票を持ち、地下へ続く階段を下りた。</p><img src="comic-12/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-12/redraw-12.jpg" alt="水城たちが階段を下りる" width="274" height="337"><p class="caption">地下資料室へ</p><p class="speech lower left" style="--point:74%">棚の箱と、この受領印つきの票を照合しましょう。</p></figure><aside class="story-narration">数字の謎は解けた。だが「処理者」の欄には、名前がなかった。</aside>
<p class="folio">4 / 4</p></section>
