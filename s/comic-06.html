<p class="eyebrow">漫画版</p>
<h1>第六話「野鳥園への予告状」</h1>
<section class="comic-page" aria-label="1ページ"><aside class="story-narration">野鳥園から連絡を受け、水城と朝倉は閉園間際の園に着いた。今夜狙われる鳥の名前が、予告状に隠されていた。</aside>
<figure class="frame f1"><img src="comic-06/remake-01.jpg" alt="閉園時刻を過ぎても開いた野鳥園の門"><p class="caption">数日後・閉園時刻の野鳥園</p></figure>
<figure class="frame f2"><img src="comic-06/remake-02.jpg" alt="園長のもとへ向かう水城と朝倉"><p class="speech point-up" style="left:7%;bottom:4%;--tail:58%;--bubble:84%">園長から連絡があった。今夜、鳥を一羽盗むという手紙が届いたそうよ。</p></figure>
<figure class="frame f3"><img src="comic-06/remake-03.jpg" alt="園長が封筒を水城に渡す"><p class="speech point-up" style="left:4%;bottom:4%;--tail:18%;--bubble:86%">狙う鳥の名前は、手紙の一行に隠したそうです。</p></figure>
<p class="folio">1 / 4</p>
</section>
<section class="comic-page" aria-label="2ページ">
<figure class="frame f4"><img src="comic-06/remake-04.jpg" alt="水城が警備室で手紙を開く"><p class="caption">園内の警備室</p></figure>
<figure class="receipt"><figcaption>手紙の一行</figcaption><p>君たちの宝、すべていただく</p></figure>
<figure class="frame f5"><img src="comic-06/remake-05.jpg" alt="朝倉が手紙の一語を指す" loading="lazy"><span class="letter-back" aria-hidden="true"></span><p class="speech point-up" style="left:4%;bottom:3%;--tail:72%;--bubble:61%">『宝』は『たから』。最初の二文字は『タカ』です。</p></figure>
<figure class="frame f6"><img src="comic-06/remake-06.jpg" alt="園長が飼育区画の案内図の前で首を振る" loading="lazy"><p class="speech point-up" style="left:4%;bottom:4%;--tail:38%;--bubble:82%">うちにタカはいません。</p></figure>
<p class="folio">2 / 4</p>
</section>
<section class="comic-page" aria-label="3ページ">
<figure class="frame f7"><img src="comic-06/remake-07.jpg" alt="水城が手紙の一行をひらがなで書き直す" loading="lazy"><p class="speech point-down" style="right:3%;top:3%;--tail:10%;--bubble:43%">タカはいない。なら、単語の境目を外して一行を読んでみよう。</p></figure>
<figure class="receipt"><figcaption>水城の手帳</figcaption><p class="bird-line">きみたちのた<mark>から、す</mark>べていただく</p></figure>
<figure class="frame f8"><img src="comic-06/remake-08.jpg" alt="朝倉が書き写した一行を見つめて考え込む" loading="lazy"><span class="notebook-back" aria-hidden="true"></span><p class="speech point-down" style="left:3%;top:3%;--tail:82%;--bubble:34%">単語の中だけだと思い込んでました。読点の前後は？</p></figure>
<figure class="frame f9"><img src="comic-06/remake-09.jpg" alt="水城が読点の前後を鉛筆でなぞる" loading="lazy"><p class="speech point-down" style="right:3%;top:3%;--tail:14%;--bubble:41%">「たから、すべて」。読点をまたぐと、カラス！</p></figure>
<p class="folio">3 / 4</p>
</section>
<section class="comic-page" aria-label="4ページ">
<figure class="frame f10"><img src="comic-06/remake-10.jpg" alt="園長が職員を呼び止めて指示する" loading="lazy"><p class="speech point-up" style="left:4%;bottom:4%;--tail:64%;--bubble:88%">カラスの区画へ。裏の出入口にも一人お願いします。</p></figure>
<figure class="frame action-panel"><p class="action-caption">指示を受けた職員が、奥の飼育区画へ急いだ。</p><img src="comic-06/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f11"><img src="comic-06/remake-11.jpg" alt="職員が灯りを頼りにカラスの区画へ向かう" loading="lazy"><p class="caption">職員は園内と裏の出入口に分かれた。夜明けまでカラスに被害はなかった。</p></figure>
<figure class="frame action-panel"><p class="action-caption">裏手では、職員が門を閉めてからカラスの区画を見回った。</p><img src="comic-06/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f12"><img src="comic-06/remake-12.jpg" alt="水城が封筒を裏返し、角が斜めに切れた黒い封を撮影する" loading="lazy"><p class="speech point-down" style="right:4%;top:3%;--tail:12%;--bubble:80%">封に黒い紙が貼ってある。切り口が分かるよう、裏も撮っておこう。</p></figure>
<aside class="story-narration">夜明け、カラスが鳴いた。無事を確かめて、園長はようやく裏門の鍵から手を離した。</aside>
<p class="folio">4 / 4</p>
</section>
