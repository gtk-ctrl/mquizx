<p class="eyebrow">漫画版</p>
<h1>第七話「予告状の消印」</h1>
<section class="comic-page" aria-label="1ページ"><aside class="story-narration">仮面舞踏会が開かれた屋敷に、その翌朝、予告状が届いた。水城たちは、警備をいつ始めるべきか確かめに来た。</aside>
<figure class="frame f1"><img src="comic-07/remake-01.jpg" alt="仮面の客が踊る屋敷の舞踏会"><p class="caption">土曜の夜・仮面舞踏会</p></figure>
<figure class="frame action-panel"><p class="action-caption">次の日の朝、水城と朝倉は屋敷へ向かった。</p><img src="comic-07/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f2"><img src="comic-07/remake-02.jpg" alt="水城と朝倉が屋敷を訪れる"><p class="caption">翌日・予告状が届いた屋敷</p></figure>
<figure class="frame f3"><img src="comic-07/remake-03.jpg" alt="屋敷の主人が二人に封筒を差し出す"><p class="speech upper right" style="--point:20%">舞踏会の翌朝、これが届いたんです。</p></figure>
<p class="folio">1 / 4</p>
</section>
<section class="comic-page" aria-label="2ページ">
<figure class="frame f4"><img src="comic-07/remake-04.jpg" alt="朝倉が封筒の消印を調べる"><p class="speech upper right" style="--point:20%">消印は土曜。差し出した日を起点にすると、決行は火曜ですね。</p></figure>
<figure class="frame f5"><img src="comic-07/remake-05.jpg" alt="屋敷の主人が卓上カレンダーの日付を見る" loading="lazy"><p class="speech lower left" style="--point:74%">舞踏会は、消印と同じ土曜の夜でした。</p></figure>
<figure class="frame f6"><img src="comic-07/remake-06.jpg" alt="水城が便箋を開き、最初の一文に目を留める" loading="lazy"><p class="speech upper right" style="--point:20%">消印の日に書いたとは限らない。手紙の最初を読んで。</p></figure>
<figure class="receipt"><figcaption>怪盗の予告状</figcaption><p>明日は仮面舞踏会。決行は、あさっての昨日の、そのまた翌々日。</p></figure>
<p class="folio">2 / 4</p>
</section>
<section class="comic-page" aria-label="3ページ">
<figure class="frame f7"><img src="comic-07/remake-07.jpg" alt="水城と朝倉が消印と文面を突き合わせる" loading="lazy"><p class="speech upper right" style="--point:20%">『明日』が土曜なら、これを書いた日は金曜ですね。</p></figure>
<figure class="frame f8"><img src="comic-07/remake-08.jpg" alt="水城が手帳に曜日を並べる" loading="lazy"><p class="speech upper right" style="--point:20%">金曜を出発点にして、一つずつ数えよう。</p></figure>
<figure class="receipt"><figcaption>舞踏会を基準にした曜日</figcaption><p><span class="day-route">金曜（執筆） → 土曜（舞踏会・消印） → 日曜（到着） → <strong>月曜（決行）</strong></span><span class="day-error">消印の土曜から数えた場合 → 火曜</span></p></figure>
<figure class="frame f9"><img src="comic-07/remake-09.jpg" alt="水城が手帳の月曜を指し、朝倉が無線を取る" loading="lazy"><p class="speech upper left" style="--point:74%">金曜のあさっては日曜。その前日、土曜から二日後。決行は月曜ね。</p></figure>
<p class="folio">3 / 4</p>
</section>
<section class="comic-page" aria-label="4ページ">
<figure class="frame f10"><img src="comic-07/remake-10.jpg" alt="朝倉が無線で屋敷の警備予定を変更する" loading="lazy"><p class="speech lower right" style="--point:20%">届いたのは今日、日曜。決行は明日です。門と裏口の警備をお願いします。</p></figure>
<figure class="frame f11"><img src="comic-07/remake-11.jpg" alt="水城が封の裏を撮り、野鳥園の写真と並べる" loading="lazy"><p class="speech upper left" style="--point:74%">この黒い封、野鳥園にもあった。停電した屋敷の宝石盗難にも、似た記録がなかった？</p></figure>
<figure class="frame action-panel"><p class="action-caption">月曜の夜。巡回の灯りが門柱を照らした。</p><img src="comic-07/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame f12"><img src="comic-07/remake-12.jpg" alt="月曜の夜、屋敷の門と裏口を警備する職員" loading="lazy"><p class="caption">月曜の夜。警備が明けるまで、屋敷から盗まれた品はなかった。</p></figure>
<aside class="story-narration">火曜の朝、屋敷の主人は玄関の鍵を開け、門の警備員に深く頭を下げた。</aside>
<p class="folio">4 / 4</p>
</section>
