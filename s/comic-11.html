<main class="comic"><p class="eyebrow">漫画版</p><h1>第十一話「鏡の中の八時二十分」</h1>
<section class="comic-page" id="page-1" aria-label="1ページ"><aside class="story-narration">宝石店に続いて、水城たちは理髪店の事件記録を開いた。今度の時刻は、機械の表示ではなく、椅子に座っていた沢村の証言だった。</aside>
<figure class="frame"><img src="comic-11/redraw-01.jpg" alt="記録室で二人が資料を開く" width="308" height="412"><p class="caption">資料室・次の事件記録</p><p class="speech lower right" style="--point:20%">宝石店に続いて、床屋の事件です。まず沢村さんの証言から。</p></figure>
<figure class="frame"><img src="comic-11/redraw-02.jpg" alt="朝倉が調書を読む" width="307" height="412"><p class="speech upper right" style="--point:20%">沢村さんは、椅子に座ったまま時計を見たそうです。</p></figure>
<figure class="frame action-panel"><p class="action-caption">事件当夜。沢村は理髪椅子に腰を下ろした。</p><img src="comic-11/action-01.jpg" alt="理容師が年配の沢村の理髪椅子を整える" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-11/redraw-03.jpg" alt="鏡の前の理髪椅子に座る沢村" width="307" height="412"><p class="caption">事件当夜・沢村の証言</p><p class="speech lower left" style="--point:74%">八時二十分でした。首は動かしていません。</p></figure>
<p class="folio">1 / 4</p></section>
<section class="comic-page" id="page-2" aria-label="2ページ">
<figure class="frame"><img src="comic-11/redraw-04.jpg" alt="手帳に時刻を書く朝倉" width="308" height="412"><p class="speech upper right" style="--point:20%">八時二十分なら、本郷を含めて時間が空く人はいません。</p></figure>
<figure class="frame"><img src="comic-11/redraw-05.jpg" alt="水城が店内の写真を調べる" width="308" height="412"><svg aria-hidden="true" focusable="false" viewBox="0 0 308 412" style="position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none"><defs><clipPath id="barber-print"><path d="M140 185L295 163L277 267L260 275L270 292L248 302L140 315L143 286L125 270Z"/></clipPath></defs><image href="comic-11/redraw-06.jpg" x="125" y="163" width="170" height="152" preserveAspectRatio="xMidYMid slice" clip-path="url(#barber-print)"/></svg><p class="speech upper right" style="--point:20%">待って。この椅子、どこを向いてる？</p></figure>
<figure class="frame"><img src="comic-11/redraw-06.jpg" alt="椅子の正面にある大きな鏡を写した店内" width="307" height="412"><svg aria-hidden="true" focusable="false" viewBox="0 0 307 412" style="position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none"><circle cx="179.3" cy="111.6" r="33" fill="#c9ad81"/><path d="M179 112L166 117M179 112L199 124" stroke="#3d3326" stroke-width="2.3" stroke-linecap="round"/><circle cx="179" cy="112" r="2" fill="#3d3326"/></svg><p class="speech lower left" style="--point:74%">椅子の正面には鏡。沢村さんは振り向いていません。</p></figure>
<p class="folio">2 / 4</p></section>
<section class="comic-page" id="page-3" aria-label="3ページ">
<figure class="review-evidence"><figcaption>理髪店の位置関係</figcaption><p>背後の壁時計 → 正面の鏡 → 椅子に座った沢村</p><p><strong>沢村の視線</strong>　椅子から正面の鏡へ</p></figure><figure class="frame"><img src="comic-11/redraw-07.jpg" alt="水城が写真の鏡を指す" width="307" height="412"><p class="speech upper right" style="--point:20%">時計があるのは椅子の後ろ。正面を向いたままなら、見えたのは鏡の中ね。</p></figure>
<figure class="frame action-panel"><p class="action-caption">朝倉は小さな鏡を取り出し、針がどう見えるか試した。</p><img src="comic-11/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-11/redraw-08.jpg" alt="朝倉が紙に鏡を当ててみる" width="308" height="412"><p class="speech upper right" style="--point:20%">じゃあ、針を左右に返すと……。</p></figure>
<figure class="mirror-proof"><div><svg viewBox="0 0 120 120" role="img" aria-label="8時20分の針"><circle cx="60" cy="60" r="56" fill="#fff8e6" stroke="#42403a"/><g fill="#202525" text-anchor="middle" dominant-baseline="middle" font-size="9"><text x="82.5" y="21.02885682970026">1</text><text x="98.97114317029974" y="37.5">2</text><text x="105" y="60">3</text><text x="98.97114317029974" y="82.49999999999999">4</text><text x="82.5" y="98.97114317029974">5</text><text x="60.00000000000001" y="105">6</text><text x="37.500000000000014" y="98.97114317029974">7</text><text x="21.028856829700274" y="82.50000000000003">8</text><text x="15" y="60.00000000000001">9</text><text x="21.02885682970026" y="37.5">10</text><text x="37.49999999999998" y="21.028856829700274">11</text><text x="59.999999999999986" y="15">12</text></g><path d="M60 60L38.4 67.9" stroke="#202525" stroke-width="4" stroke-linecap="round"/><path d="M60 60L92.9 79.0" stroke="#202525" stroke-width="2.5" stroke-linecap="round"/><circle cx="60" cy="60" r="2.7" fill="#202525"/></svg><span>鏡越しに見えた針</span></div><div><svg viewBox="0 0 120 120" role="img" aria-label="3時40分の針"><circle cx="60" cy="60" r="56" fill="#fff8e6" stroke="#42403a"/><g fill="#202525" text-anchor="middle" dominant-baseline="middle" font-size="9"><text x="82.5" y="21.02885682970026">1</text><text x="98.97114317029974" y="37.5">2</text><text x="105" y="60">3</text><text x="98.97114317029974" y="82.49999999999999">4</text><text x="82.5" y="98.97114317029974">5</text><text x="60.00000000000001" y="105">6</text><text x="37.500000000000014" y="98.97114317029974">7</text><text x="21.028856829700274" y="82.50000000000003">8</text><text x="15" y="60.00000000000001">9</text><text x="21.02885682970026" y="37.5">10</text><text x="37.49999999999998" y="21.028856829700274">11</text><text x="59.999999999999986" y="15">12</text></g><path d="M60 60L81.6 67.9" stroke="#202525" stroke-width="4" stroke-linecap="round"/><path d="M60 60L27.1 79.0" stroke="#202525" stroke-width="2.5" stroke-linecap="round"/><circle cx="60" cy="60" r="2.7" fill="#202525"/></svg><span>針の向きを左右に戻す</span></div><figcaption>針の向きを比べるため、数字は読み取り用に補った。</figcaption></figure><figure class="frame discovery"><img src="comic-11/redraw-09.jpg" alt="二人で時計の図を見比べる" width="308" height="412"><p class="speech upper left" style="--point:74%">長針が四から八へ。短針も返すと……三時四十分！</p></figure>
<p class="folio">3 / 4</p></section>
<section class="comic-page" id="page-4" aria-label="4ページ">
<figure class="review-evidence"><figcaption>当夜のアリバイ照合</figcaption><div class="pair"><p>8:20<br>空白のある人はいない</p><p>3:40<br><strong>本郷だけ空白</strong></p></div></figure><figure class="frame"><img src="comic-11/redraw-10.jpg" alt="アリバイ表を指す水城" width="307" height="412"><p class="speech upper right" style="--point:20%">当夜の記録で、午前三時四十分にアリバイが空くのは本郷だけ。</p></figure>
<figure class="frame"><img src="comic-11/redraw-11.jpg" alt="朝倉が訂正票を取り出す" width="307" height="412"><p class="speech upper right" style="--point:20%">当時の担当者も午前三時四十分に直しています。訂正票がありました。</p></figure>
<figure class="frame"><img src="comic-11/redraw-12.jpg" alt="二件の訂正票を机に並べる二人" width="308" height="412"><p class="speech upper left" style="--point:74%">訂正票は二件とも直ってる。配られた資料にも、この時刻が載ってる？</p></figure>
<aside class="story-narration">沢村が見た針は、証言どおりだった。朝倉は手帳の「時計」を「鏡の中の時計」に直した。</aside>
<p class="folio">4 / 4</p></section>
