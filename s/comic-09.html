<main class="comic"><p class="eyebrow">漫画版</p><h1>第九話「二度降った雨」</h1>
<section class="comic-page" id="page-1" aria-label="1ページ"><aside class="story-narration">封の照合結果を送った翌朝、別の日の記録に付いた喫茶店の写真が資料室に届いた。担当者は、日付が違うのに似すぎていると感じていた。</aside><figure class="frame"><img src="comic-09/redraw-01.jpg" alt="瀬尾が撮影記録を持ってくる" loading="lazy" width="308" height="412"><p class="caption">翌朝・資料室</p><p class="speech lower right" style="--point:20%">封の照合写真を送った担当が、この二枚も見てくれと。別の日の記録に付いていたそうだ。</p></figure>
<figure class="frame action-panel"><p class="action-caption">雨の夜、喫茶店の外では足音に合わせて水が跳ねた。</p><img src="comic-09/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-09/redraw-02.jpg" alt="机の上に配布写真二枚" loading="lazy" width="307" height="412"><p class="caption">喫茶店の配布記録。添付先に記された日付は別々。</p></figure>
<figure class="frame"><img src="comic-09/redraw-03.jpg" alt="朝倉が二枚の写真の窓を指す" loading="lazy" width="307" height="412"><p class="speech upper right" style="--point:20%">日付は別でも、同じ店なら赤い傘が写ることはあるか。</p></figure><p class="folio">1 / 4</p></section>
<section class="comic-page" id="page-2" aria-label="2ページ"><figure class="frame"><img src="comic-09/redraw-04.jpg" alt="水城が写真を机に並べ直す" loading="lazy" width="308" height="412"><p class="speech upper right" style="--point:20%">傘だけじゃない。箱の傾きと、靴の後ろを見て。</p></figure><figure class="rain-proof"><div class="rain-pair"><figure><img src="comic-09/rain-detail.jpg" alt="赤い傘、傾いた箱、靴の後ろの水しぶき"><figcaption>配布記録 A ／ 窓外</figcaption></figure><figure><img src="../img/archive/g8_046_win.jpg" alt="同じ形の傘、箱、水しぶき"><figcaption>配布記録 B ／ 窓外</figcaption></figure></div><figcaption>赤い傘、傾いた箱、水しぶきの形が一致。</figcaption></figure>
<figure class="frame"><img src="comic-09/redraw-05.jpg" alt="朝倉が足元のしぶきを見比べる" loading="lazy" width="308" height="412"><p class="speech lower left" style="--point:74%">しぶきの筋まで一致してる。同じ瞬間の写真が、別の日付で配られた？</p></figure>
<figure class="frame action-panel"><p class="action-caption">その午後、捜査本部から分厚い封筒が届いた。</p><img src="comic-09/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-09/redraw-06.jpg" alt="最終報告の束が机に届く" loading="lazy" width="307" height="412"><p class="caption">その午後・捜査本部から最終報告</p></figure><p class="folio">2 / 4</p></section>
<section class="comic-page" id="page-3" aria-label="3ページ"><aside class="story-narration">午後、捜査本部から最終報告が届いた。</aside><figure class="frame"><img src="comic-09/redraw-07.jpg" alt="係長が添付写真を開く" loading="lazy" width="307" height="412"><p class="speech upper left" style="--point:74%">この写真を根拠に、男を一連の事件の指示役としたそうだ。</p></figure><figure class="rain-proof"><img class="report-photo" src="comic-20/review-final_report.jpg" alt="書斎の男と机の上の封筒、メダル"><figcaption>最終報告の添付写真。机上に事件の関連物品があるとされる。</figcaption></figure>
<figure class="frame"><img src="comic-09/redraw-08.jpg" alt="水城が報告写真の窓に気づく" loading="lazy" width="308" height="412"><svg aria-hidden="true" focusable="false" viewBox="0 0 308 412" style="position:absolute;inset:1px;width:calc(100% - 2px);height:calc(100% - 2px);pointer-events:none"><path d="M161 163L294 142L273 274L254 278L241 285L236 295L134 316Z" fill="#b3a28a"/></svg><p class="speech upper right" style="--point:20%">……窓に赤い傘。係長、その写真を見せてください。</p></figure>
<figure class="frame"><img src="comic-09/redraw-09.jpg" alt="水城が喫茶店の資料を持ってくる" loading="lazy" width="308" height="412"><p class="speech upper right" style="--point:20%">書斎の窓を拡大して、さっきの窓外と並べてください。</p></figure><figure class="rain-proof"><div class="rain-pair"><figure><img src="comic-09/rain-detail.jpg" alt="喫茶店の窓外の拡大"><figcaption>喫茶店の配布写真</figcaption></figure><figure><img src="comic-09/report-window.jpg" alt="最終報告の書斎の窓を拡大"><figcaption>最終報告 ／ 書斎の窓</figcaption></figure></div></figure><p class="folio">3 / 4</p></section>
<section class="comic-page" id="page-4" aria-label="4ページ"><figure class="frame"><img src="comic-09/redraw-10.jpg" alt="係長と朝倉が並べた写真をのぞく" loading="lazy" width="307" height="412"><p class="speech upper left" style="--point:74%">箱の傾きも、しぶきも同じだ。最終報告の写真にも、あの窓外が写っている。</p></figure>
<figure class="frame"><img src="comic-09/redraw-11.jpg" alt="係長が印箱を閉じる" loading="lazy" width="307" height="412"><p class="speech lower left" style="--point:74%">報告の受け付けは保留だ。撮影元が分かるまで、この写真を指示役の証拠にはできない。</p></figure>
<figure class="frame"><img src="comic-09/redraw-12.jpg" alt="水城と朝倉が記録を開き直す" loading="lazy" width="308" height="412"><p class="caption">資料室・日没後</p><p class="speech lower right" style="--point:20%">写真の出どころは空欄。手掛かりは、並んだ事件番号だけだった。</p></figure><aside class="story-narration">別の日付に添えられた写真で、雨のしぶきまで同じ形をしていた。その一瞬が最終報告の窓にも写っていたため、報告の受け付けは止まった。</aside>
<p class="folio">4 / 4</p></section>
