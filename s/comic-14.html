<main class="comic"><p class="eyebrow">漫画版</p><h1>第十四話「水の跡が残った密室」</h1>
<section class="comic-page" id="page-1" aria-label="1ページ"><aside class="story-narration">扉の傷が配布版で見えなくなっていたため、水城たちは同じ棚の別の事件にも目を向けた。発見時の調書には、床に水が残っていたとある。</aside>
<figure class="frame action-panel"><p class="action-caption">朝倉は隣の棚から別の箱を引き出した。</p><img src="comic-14/action-01.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame"><img src="comic-14/redraw-01.jpg" alt="二人が隣の箱を開く" width="358" height="358"><p class="caption">地下資料室・隣の箱</p><p class="speech lower right" style="--point:20%">今度の配布版には金具が写ってます。でも、調書にある床の水は見えません。</p></figure>
<figure class="frame"><img src="comic-14/redraw-02.jpg" alt="朝倉が発見時の調書を読む" width="358" height="358"><p class="speech upper right" style="--point:20%">戸を開けたとき、床には水が残っていたそうです。</p></figure>
<figure class="frame"><img src="comic-14/redraw-03.jpg" alt="水城が室内全景を広げる" width="358" height="358"><p class="speech upper right" style="--point:20%">床の水は時間が経てば乾く。どの写真がいつ撮られたか確認しよう。</p></figure>
<p class="folio">1 / 4</p></section>
<section class="comic-page" id="page-2" aria-label="2ページ">
<figure class="frame"><img src="comic-14/redraw-04.jpg" alt="床と戸の金具を写した二枚の写真" width="358" height="358"></figure><figure class="comparison"><figcaption>現場写真の記録</figcaption><table><tr><th scope="row">室内全景</th><td>暗い床の隅に水の跡</td></tr><tr><th scope="row">金具の拡大</th><td>受け金具の脇に細いこすれ跡</td></tr></table></figure>
<figure class="frame"><img src="comic-14/redraw-05.jpg" alt="水城が金具の拡大写真を見る" width="358" height="358"><p class="speech upper right" style="--point:20%">金具のアップだけだと、床が乾いていたかさえ分からないね。</p></figure>
<figure class="frame"><img src="comic-14/redraw-06.jpg" alt="朝倉が戸と床の写真を見比べる" width="358" height="358"><p class="speech upper right" style="--point:20%">発見するまで、ずっと閉まっていたんでしょうか。</p></figure>
<p class="folio">2 / 4</p></section>
<section class="comic-page" id="page-3" aria-label="3ページ">
<figure class="frame"><img src="comic-14/redraw-07.jpg" alt="水城が調書の発見欄をたどる" width="358" height="358"><p class="speech upper right" style="--point:20%">記録で分かるのは、発見時にかんぬきが掛かっていたことまで。</p></figure>
<figure class="frame"><img src="comic-14/redraw-08.jpg" alt="瀬尾が撮影一覧を開く" width="358" height="358"><p class="speech upper right" style="--point:20%">撮影順は床、次に金具。欄外にも撮影時のメモがある。</p></figure>
<figure class="frame"><img src="comic-14/redraw-09.jpg" alt="鉛筆書きが残る撮影一覧" width="358" height="358"><p style="position:absolute;top:33%;left:15%;margin:0;color:#454139;font-family:serif;font-size:clamp(1rem,3vw,1.55rem);transform:rotate(-4deg)">水が乾く前に床を撮影。<br>次に金具。</p></figure>
<figure class="review-evidence"><figcaption>撮影一覧の順序</figcaption><p>発見 → <strong>水が乾く前に床を撮影</strong> → 金具を撮影</p></figure><p class="folio">3 / 4</p></section>
<section class="comic-page" id="page-4" aria-label="4ページ">
<figure class="investigation"><figcaption>濡れた床と金具 ／ 配布範囲の模式図</figcaption><div class="sides"><div><img src="comic-14/redraw-04.jpg" alt="床と金具の元記録">元資料の二つの手掛かり</div><div><div class="cropped floor-cut"><img src="comic-14/redraw-04.jpg" alt="床の部分が配布範囲に入らないことを示す"></div>配布版に残ったのは金具</div></div><p>撮影一覧をたどると、水が残っていた時点に床と金具が一緒に写った全景が見つかった。</p></figure><figure class="frame action-panel"><p class="action-caption">撮影順をたどり、水城は全景の入った封筒を開いた。</p><img src="comic-14/action-02.jpg" alt="" width="480" height="480" loading="lazy"></figure>
<figure class="frame discovery"><img src="comic-14/redraw-10.jpg" alt="水城が全景写真を一枚戻す" width="358" height="358"><p class="speech upper left" style="--point:74%">この全景だ。濡れた板二枚と、その上の金具が一枚に写ってる。</p></figure>
<figure class="frame"><img src="comic-14/redraw-11.jpg" alt="水城が撮影一覧の行を丸で囲む" width="358" height="358"><p class="speech upper right" style="--point:20%">この一枚なら、濡れた床が戸のどこまで続いていたか読める。</p></figure>
<figure class="frame"><img src="comic-14/redraw-12.jpg" alt="朝倉が次の封筒を手渡す" width="358" height="358"><p class="speech upper left" style="--point:74%">写真の番号に「乾く前」と添えます。後で見る人にも伝わるように。</p></figure>
<aside class="story-narration">乾けば消えるはずの水跡が、撮影順をたどった先の一枚に残っていた。</aside>
<p class="folio">4 / 4</p></section>
