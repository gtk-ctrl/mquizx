name: case-stats
on:
  schedule:
    - cron: "17 19 * * *"        # 毎日 04:17 JST
  workflow_dispatch:
    inputs:
      start_date:
        description: "集計開始日（過去分の再集計用。例 2026-10-28。空なら全期間）"
        required: false
        default: ""
concurrency:
  group: case-stats
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-analytics-data
      - name: Build case-stats.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          START_DATE: ${{ github.event.inputs.start_date }}
        run: python .github/scripts/fetch_case_stats.py
      - name: Commit if changed
        run: |
          # updated（更新日時）だけが変わる日もそのまま反映する
          if git diff --quiet -- case-stats.json; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-stats.json
          git commit -m "Update case-stats.json"
          git push
