<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16232c"><title>上級の推理クイズ｜未解決ファイル</title><meta name="description" content="上級の推理クイズをまとめています。"><meta property="og:title" content="上級の推理クイズ｜未解決ファイル"><meta property="og:description" content="上級の推理クイズをまとめています。"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet"><style>
